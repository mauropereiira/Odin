name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run check:all
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-launcher:
    name: macOS launcher
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Install app wrapper
        run: bash scripts/install.sh
      - name: Verify app bundle
        run: |
          test -d /Applications/Odin.app
          test -x /Applications/Odin.app/Contents/MacOS/applet
          plutil -lint /Applications/Odin.app/Contents/Info.plist
          codesign --verify --deep --strict /Applications/Odin.app
      - name: Uninstall app wrapper
        if: ${{ always() }}
        run: bash scripts/uninstall.sh
