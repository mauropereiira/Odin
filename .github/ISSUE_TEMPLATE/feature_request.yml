name: Feature request
description: Propose an improvement to Odin
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should Odin address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Note any new provider, file, process, network, permission, or persistence access.
